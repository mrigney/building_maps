        // Function to get color based on height
        function getColor(height) {
            if (height < 15) return '#2ecc71';
            if (height < 30) return '#3498db';
            if (height < 60) return '#f39c12';
            return '#e74c3c';
        }

        // Function to get road color based on type
        function getRoadColor(roadType) {
            var colors = {
                'motorway': '#e74c3c',
                'trunk': '#e67e22',
                'primary': '#f39c12',
                'secondary': '#f1c40f',
                'tertiary': '#95a5a6',
                'residential': '#3498db',
                'service': '#bdc3c7',
                'footway': '#2ecc71',
                'path': '#27ae60',
                'unknown': '#7f8c8d'
            };
            return colors[roadType] || colors['unknown'];
        }

        // Function to get road weight based on type
        function getRoadWeight(roadType) {
            var weights = {
                'motorway': 5,
                'trunk': 4,
                'primary': 4,
                'secondary': 3,
                'tertiary': 3,
                'residential': 2,
                'service': 1,
                'footway': 1,
                'path': 1,
                'unknown': 2
            };
            return weights[roadType] || 2;
        }

        // Add roads to map (draw first so buildings appear on top)
        roads.forEach(function(road) {
            var color = getRoadColor(road.type);
            var weight = getRoadWeight(road.type);

            // Convert coordinates to Leaflet format [[lat, lon], ...]
            var latLngs = road.coordinates.map(function(coord) {
                return [coord[0], coord[1]];
            });

            var polyline = L.polyline(latLngs, {
                color: color,
                weight: weight,
                opacity: 0.7
            });

            // Create popup
            var popupContent = `
                <div class="building-popup">
                    <h4>${road.name}</h4>
                    <table>
                        <tr><td>Type:</td><td>${road.type}</td></tr>
                        <tr><td>ID:</td><td>${road.id}</td></tr>
                    </table>
                </div>
            `;

            polyline.bindPopup(popupContent);
            polyline.addTo(map);
        });

        // Add buildings to map
        buildings.forEach(function(building) {
            var color = getColor(building.height);
            var radius = 5 + (building.height / 10);

            var circle = L.circleMarker([building.lat, building.lon], {
                radius: radius,
                fillColor: color,
                color: '#333',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.7
            });

            // Create popup
            var popupContent = `
                <div class="building-popup">
                    <h4>${building.id}</h4>
                    <table>
                        <tr><td>Type:</td><td>${building.type}</td></tr>
                        <tr><td>Height:</td><td>${building.height.toFixed(1)} m</td></tr>
                        <tr><td>Area:</td><td>${building.area.toFixed(1)} m²</td></tr>
                        <tr><td>Model:</td><td>${building.model}</td></tr>
                    </table>
                </div>
            `;

            circle.bindPopup(popupContent);
            circle.addTo(map);

            // Add height label
            var label = L.marker([building.lat, building.lon], {
                icon: L.divIcon({
                    className: 'height-label',
                    html: '<div style="font-size: 9px; color: black; text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white; font-weight: bold;">' +
                          building.height.toFixed(0) + 'm</div>',
                    iconSize: [30, 10],
                    iconAnchor: [15, -5]
                })
            });
            label.addTo(map);
        });

        // Add bounding box
        var bounds = [
            [47.606, -122.336],
            [47.608, -122.334]
        ];
        L.rectangle(bounds, {
            color: '#e74c3c',
            weight: 2,
            fillOpacity: 0,
            dashArray: '5, 5'
        }).addTo(map);
    </script>
